name: Scrape Jobs

on:
  schedule:
    - cron: '0 2 * * *'   # runs daily at 2 AM UTC (7:30 AM IST)
  workflow_dispatch:        # allows manual trigger via API (the Refresh button)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v1

      - name: Install dependencies
        run: pip install playwright openpyxl httpx

      - name: Install Chromium (only if not cached)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Chromium system deps (always, cached browser needs libs)
        run: playwright install-deps chromium

      - name: Run scraper
        run: python find_jobs.py

      - name: Commit updated jobs.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json index.html
          git diff --cached --quiet || git commit -m "chore: update jobs [skip ci]"
          git push
