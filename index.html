<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>SFJobs — Salesforce Jobs India</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00b074;--green-dk:#009962;--green-lt:#e8faf4;
  --text:#18181b;--text2:#64748b;--muted:#94a3b8;
  --border:rgba(255,255,255,0.45);--radius:16px;--radius-sm:10px;
}
html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;font-size:14px;background:linear-gradient(145deg,#eaf7f1 0%,#f0f4ff 40%,#fdf0f8 100%);color:var(--text);background-attachment:fixed}

/* ── GLASS UTIL ── */
.glass{background:rgba(255,255,255,0.62);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.55);box-shadow:0 4px 24px rgba(0,0,0,0.07),0 1px 4px rgba(0,0,0,0.04)}
.glass-dk{background:rgba(10,40,28,0.82);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.08)}

/* ── TOP BAR ── */
.topbar{background:rgba(10,40,28,0.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:7px 40px;display:flex;align-items:center;justify-content:space-between;font-size:.72rem;color:rgba(255,255,255,.5)}
.topbar-right{font-size:.72rem;color:rgba(255,255,255,.45)}

/* ── NAV ── */
nav{background:rgba(255,255,255,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-bottom:1px solid rgba(255,255,255,0.5);padding:0 40px;height:62px;display:flex;align-items:center;position:sticky;top:0;z-index:200;box-shadow:0 2px 20px rgba(0,0,0,0.06)}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;margin-right:32px}
.logo svg{width:28px;height:28px}
.logo-text{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.5px}
.logo-text span{color:var(--green)}
.nav-link{color:var(--text2);font-size:.82rem;font-weight:600;padding:7px 14px;border-radius:8px;cursor:pointer;transition:all .15s;text-decoration:none}
.nav-link:hover,.nav-link.active{color:var(--text);background:rgba(0,0,0,0.05)}
.nav-right{display:flex;align-items:center;gap:10px;margin-left:auto}
#refresh-btn{display:flex;align-items:center;gap:7px;padding:9px 20px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:.82rem;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 12px rgba(0,176,116,0.35)}
#refresh-btn:hover:not(.running){background:var(--green-dk);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,176,116,0.4)}
#refresh-btn.running{opacity:.7;pointer-events:none}
.spin.active{display:inline-block;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.nav-avatar{width:34px;height:34px;background:linear-gradient(135deg,var(--green),#00d4a0);border-radius:50%;display:grid;place-items:center;color:#fff;font-size:.72rem;font-weight:800;box-shadow:0 2px 10px rgba(0,176,116,0.3)}

/* ── TIMER BANNER ── */
#timer-banner{display:none;background:rgba(236,253,245,0.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(110,231,183,0.5);padding:10px 40px;align-items:center;gap:12px}
#timer-banner.show{display:flex}
.timer-dot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:pulse 1.5s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.timer-text{font-size:.8rem;color:#065f46;flex:1}
#timer-countdown{font-size:.82rem;font-weight:800;color:#065f46;background:rgba(167,243,208,0.7);padding:3px 12px;border-radius:20px;font-variant-numeric:tabular-nums;min-width:58px;text-align:center}
.timer-cancel{color:var(--muted);font-size:.75rem;cursor:pointer;padding:4px 8px;border-radius:6px;border:none;background:transparent}

/* ── HERO ── */
.hero{background:linear-gradient(140deg,#0a1f15 0%,#0d2e1e 50%,#0a1f28 100%);padding:48px 40px 40px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-60px;left:50%;transform:translateX(-50%);width:600px;height:300px;background:radial-gradient(ellipse,rgba(0,176,116,0.18) 0%,transparent 70%);pointer-events:none}
.hero h1{font-size:1.9rem;font-weight:800;color:#fff;letter-spacing:-.5px;margin-bottom:5px}
.hero p{color:rgba(255,255,255,.5);font-size:.87rem;margin-bottom:26px}
.hero-search{display:flex;align-items:center;background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.2);border-radius:14px;overflow:hidden;max-width:780px;margin:0 auto;box-shadow:0 8px 32px rgba(0,0,0,0.25)}
.hs-field{display:flex;align-items:center;gap:8px;padding:0 18px;flex:1;border-right:1px solid rgba(255,255,255,0.12)}
.hs-field input,.hs-field select{border:none;outline:none;background:transparent;color:#fff;font-size:.86rem;width:100%;font-family:inherit;padding:15px 0}
.hs-field input::placeholder{color:rgba(255,255,255,0.4)}
.hs-field select{cursor:pointer;color:rgba(255,255,255,0.75)}
.hs-field select option{background:#1a3a2f;color:#fff}
.hs-field svg{color:rgba(255,255,255,0.4);flex-shrink:0}
.hs-clear{padding:0 16px;color:rgba(255,255,255,0.45);font-size:.8rem;cursor:pointer;border:none;background:transparent;height:52px;transition:color .15s}
.hs-clear:hover{color:rgba(255,255,255,0.8)}
.hs-search-btn{padding:0 28px;background:var(--green);color:#fff;border:none;font-size:.86rem;font-weight:700;cursor:pointer;height:52px;transition:background .15s}
.hs-search-btn:hover{background:var(--green-dk)}

/* ── FILTER BAR ── */
.filter-bar{background:rgba(255,255,255,0.6);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,0.5);padding:12px 40px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;box-shadow:0 2px 12px rgba(0,0,0,0.04);position:sticky;top:62px;z-index:100}
.plat-scroll{display:flex;align-items:center;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding-bottom:1px}
.plat-scroll::-webkit-scrollbar{display:none}
.plat-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border-radius:20px;font-size:.75rem;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;border:1.5px solid rgba(0,0,0,0.07);background:rgba(255,255,255,0.7);color:var(--text2)}
.plat-chip:hover{background:rgba(255,255,255,0.95);color:var(--text)}
.plat-chip.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 10px rgba(0,176,116,0.3)}
.plat-chip .cnt{opacity:.7;font-size:.68rem}
.fb-sep{width:1px;height:24px;background:rgba(0,0,0,0.1);flex-shrink:0}
.fb-select{border:1.5px solid rgba(0,0,0,0.08);border-radius:10px;padding:6px 10px;font-size:.78rem;outline:none;color:var(--text);background:rgba(255,255,255,0.75);cursor:pointer;font-family:inherit;font-weight:600;backdrop-filter:blur(10px)}
.fb-select:focus{border-color:var(--green)}
.results-info{font-size:.82rem;color:var(--text2);white-space:nowrap;flex-shrink:0}
.results-info strong{color:var(--text);font-size:.9rem}

/* ── MAIN GRID ── */
.page{max-width:1280px;margin:0 auto;padding:28px 28px 40px}
.jobs-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

/* ── JOB CARD ── */
.job-card{background:rgba(255,255,255,0.65);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,0.6);border-radius:var(--radius);padding:18px;box-shadow:0 2px 16px rgba(0,0,0,0.06),0 1px 3px rgba(0,0,0,0.04);transition:all .22s;display:flex;flex-direction:column;gap:12px;position:relative}
.job-card:hover{background:rgba(255,255,255,0.88);transform:translateY(-3px);box-shadow:0 12px 40px rgba(0,0,0,0.1),0 4px 12px rgba(0,176,116,0.1);border-color:rgba(0,176,116,0.25)}
.jc-header{display:flex;align-items:center;gap:11px}
.jc-logo{width:44px;height:44px;border-radius:11px;overflow:hidden;flex-shrink:0;background:linear-gradient(135deg,#e8faf4,#d1fae5);border:1px solid rgba(0,176,116,0.15);display:grid;place-items:center;font-size:.85rem;font-weight:800;color:var(--green)}
.jc-logo img{width:100%;height:100%;object-fit:contain;border-radius:10px;padding:4px}
.jc-company-row{flex:1;min-width:0}
.jc-company{font-size:.78rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jc-plat{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:3px}
.plat-LinkedIn{background:#dbeafe;color:#1d4ed8}
.plat-Indeed{background:#eff6ff;color:#2563eb}
.plat-Greenhouse{background:#dcfce7;color:#15803d}
.plat-Lever{background:#fdf4ff;color:#9333ea}
.plat-Workday{background:#fff7ed;color:#c2410c}
.plat-Glassdoor{background:#fef9c3;color:#854d0e}
.plat-SmartRecruiters{background:#fce7f3;color:#be185d}
.plat-other{background:#f1f5f9;color:#475569}
.jc-title{font-size:.9rem;font-weight:700;color:var(--text);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.jc-badges{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:.69rem;font-weight:700}
.badge-senior{background:rgba(220,252,231,0.8);color:#15803d}
.badge-mid{background:rgba(237,233,254,0.8);color:#7c3aed}
.badge-junior{background:rgba(254,249,195,0.8);color:#854d0e}
.badge-new{background:rgba(0,176,116,0.12);color:var(--green)}
.jc-footer{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px;border-top:1px solid rgba(0,0,0,0.05)}
.jc-meta{display:flex;align-items:center;gap:10px;font-size:.72rem;color:var(--text2)}
.jc-meta span{display:flex;align-items:center;gap:3px}
.age-fresh{color:var(--green);font-weight:700}
.age-recent{color:#d97706;font-weight:600}
.age-old{color:var(--muted)}
.btn-apply{padding:7px 16px;background:var(--green);color:#fff;border-radius:9px;font-size:.77rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;transition:all .18s;box-shadow:0 2px 8px rgba(0,176,116,0.25);white-space:nowrap}
.btn-apply:hover{background:var(--green-dk);transform:translateY(-1px);box-shadow:0 4px 14px rgba(0,176,116,0.35)}

/* ── SKELETON ── */
.sk{display:inline-block;background:linear-gradient(90deg,rgba(0,0,0,0.06) 25%,rgba(0,0,0,0.1) 50%,rgba(0,0,0,0.06) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:6px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── PAGINATION ── */
.pagination{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:28px;flex-wrap:wrap}
.page-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid rgba(0,0,0,0.1);background:rgba(255,255,255,0.65);backdrop-filter:blur(10px);font-size:.8rem;font-weight:700;color:var(--text2);cursor:pointer;display:grid;place-items:center;transition:all .15s}
.page-btn:hover{border-color:var(--green);color:var(--green);background:rgba(255,255,255,0.9)}
.page-btn.active{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 2px 10px rgba(0,176,116,0.3)}
.page-btn:disabled{opacity:.35;pointer-events:none}
.page-ellipsis{width:36px;text-align:center;color:var(--muted);font-size:.8rem}

/* ── EMPTY ── */
.empty-state{text-align:center;padding:64px 20px;background:rgba(255,255,255,0.55);backdrop-filter:blur(16px);border-radius:var(--radius);border:1px solid rgba(255,255,255,0.5);grid-column:1/-1}
.empty-state .icon{font-size:2.5rem;margin-bottom:14px}
.empty-state h3{font-size:1rem;font-weight:700;margin-bottom:6px}

/* ── FOOTER ── */
footer{background:rgba(10,25,18,0.95);backdrop-filter:blur(20px);color:rgba(255,255,255,.5);padding:36px 40px 20px;margin-top:40px}
.footer-bottom{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;max-width:1280px;margin:0 auto}

/* ── TOAST ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(24,24,27,0.9);backdrop-filter:blur(16px);color:#fff;border-radius:12px;padding:10px 22px;font-size:.8rem;opacity:0;pointer-events:none;transition:all .3s;z-index:999;font-weight:600;box-shadow:0 4px 20px rgba(0,0,0,0.25);border:1px solid rgba(255,255,255,0.1)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:960px){
  .jobs-grid{grid-template-columns:repeat(2,1fr)}
  .topbar{display:none}
  nav{padding:0 16px}
  .hero{padding:32px 16px 28px}
  .filter-bar{padding:10px 16px}
  .page{padding:16px}
}
@media(max-width:600px){
  .jobs-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="topbar">
  <span>🇮🇳 Salesforce Jobs India — Updated daily</span>
  <span id="last-updated" class="topbar-right"></span>
</div>

<nav>
  <a class="logo" href="#">
    <svg viewBox="0 0 24 24" fill="none"><path d="M10.017 4.498a4.265 4.265 0 0 1 3.044-1.265 4.29 4.29 0 0 1 3.796 2.29 3.236 3.236 0 0 1 1.356-.296 3.27 3.27 0 0 1 3.27 3.27 3.265 3.265 0 0 1-.394 1.567A2.85 2.85 0 0 1 22 12.571a2.858 2.858 0 0 1-2.857 2.857h-9.715a3.927 3.927 0 0 1-3.928-3.928 3.93 3.93 0 0 1 2.107-3.498 4.26 4.26 0 0 1 2.41-3.504z" fill="#00b074"/><path d="M4.73 14.93a2.34 2.34 0 0 0-.73.057A2.572 2.572 0 0 0 2 17.5a2.572 2.572 0 0 0 2.571 2.571h8.715a2.143 2.143 0 0 0 2.143-2.143 2.143 2.143 0 0 0-1.286-1.964 2.862 2.862 0 0 0 .072-.643 2.858 2.858 0 0 0-2.858-2.857 2.855 2.855 0 0 0-2.43 1.357A2.34 2.34 0 0 0 7.5 13.5a2.357 2.357 0 0 0-2.77 1.43z" fill="#009962"/></svg>
    <span class="logo-text">SF<span>Jobs</span></span>
  </a>
  <a class="nav-link active" href="#">Find Jobs</a>
  <div class="nav-right">
    <button id="refresh-btn" onclick="triggerRefresh()">
      <span class="spin" id="spin-icon">↻</span>
      <span id="refresh-label">Refresh Jobs</span>
    </button>
    <div class="nav-avatar">MS</div>
  </div>
</nav>

<div id="timer-banner">
  <div class="timer-dot"></div>
  <span class="timer-text">Scraper running — new results in <strong>~2 min</strong></span>
  <span id="timer-countdown">2:00</span>
  <button class="timer-cancel" onclick="cancelRefresh()">Cancel ×</button>
</div>

<div class="hero">
  <h1>Find Your Salesforce Jobs</h1>
  <p>Fresh Salesforce roles across India, updated every day</p>
  <div class="hero-search">
    <div class="hs-field" style="flex:1.8">
      <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Job title or keywords…" oninput="applyFilters()"/>
    </div>
    <div class="hs-field" style="flex:1">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <select id="hero-loc" onchange="setLoc(this.value)" style="flex:1">
        <option value="">All Cities</option>
      </select>
    </div>
    <div class="hs-field" style="flex:1">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></svg>
      <select id="hero-sen" onchange="setSeniority(this.value)" style="flex:1">
        <option value="">All Levels</option>
        <option value="senior">Senior / Lead</option>
        <option value="mid">Mid Level</option>
        <option value="junior">Junior</option>
      </select>
    </div>
    <button class="hs-clear" onclick="clearAll()">Clear</button>
    <button class="hs-search-btn" onclick="applyFilters()">Search</button>
  </div>
</div>

<!-- FILTER BAR -->
<div class="filter-bar">
  <div class="plat-scroll" id="plat-pills"></div>
  <div class="fb-sep"></div>
  <select class="fb-select" id="time-sel" onchange="setTime(this.value)">
    <option value="720">30 days</option>
    <option value="168" selected="selected">7 days</option>
    <option value="72">3 days</option>
    <option value="24">24 hours</option>
    <option value="12">12 hours</option>
    <option value="6">6 hours</option>
    <option value="1">1 hour</option>
  </select>
  <select class="fb-select" id="sort-sel" onchange="applyFilters()">
    <option value="default">Newest</option>
    <option value="title">Title A–Z</option>
    <option value="company">Company A–Z</option>
  </select>
  <div class="fb-sep"></div>
  <div class="results-info" id="results-count"></div>
</div>

<!-- GRID -->
<div class="page">
  <div class="jobs-grid" id="jobs-list">
    <div class="job-card"><div class="jc-header"><div class="jc-logo"><div class="sk" style="width:44px;height:44px;border-radius:10px;display:block"></div></div><div class="jc-company-row"><div class="sk" style="width:90px;height:12px;display:block;margin-bottom:6px"></div><div class="sk" style="width:60px;height:10px;display:block"></div></div></div><div class="sk" style="width:90%;height:14px;display:block;margin-bottom:6px"></div><div class="sk" style="width:60%;height:14px;display:block"></div></div>
    <div class="job-card"><div class="jc-header"><div class="jc-logo"><div class="sk" style="width:44px;height:44px;border-radius:10px;display:block"></div></div><div class="jc-company-row"><div class="sk" style="width:80px;height:12px;display:block;margin-bottom:6px"></div><div class="sk" style="width:55px;height:10px;display:block"></div></div></div><div class="sk" style="width:85%;height:14px;display:block;margin-bottom:6px"></div><div class="sk" style="width:55%;height:14px;display:block"></div></div>
    <div class="job-card"><div class="jc-header"><div class="jc-logo"><div class="sk" style="width:44px;height:44px;border-radius:10px;display:block"></div></div><div class="jc-company-row"><div class="sk" style="width:100px;height:12px;display:block;margin-bottom:6px"></div><div class="sk" style="width:65px;height:10px;display:block"></div></div></div><div class="sk" style="width:80%;height:14px;display:block;margin-bottom:6px"></div><div class="sk" style="width:70%;height:14px;display:block"></div></div>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<footer>
  <div class="footer-bottom">
    <span>© 2026 SFJobs · Salesforce Jobs India · Updated daily</span>
    <span id="footer-updated"></span>
  </div>
</footer>

<div id="toast"></div>

<script>

const WORKER_URL = 'https://job-finder-refresh.manishsharma1k9909.workers.dev';
const CITIES = ['Mumbai','Delhi','Bengaluru','Bangalore','Hyderabad','Chennai','Pune','Kolkata',

  'zensar':'zensar.com','eightfold':'eightfold.ai','ntt data':'nttdata.com',
  'nttdata':'nttdata.com','bmc':'bmc.com','fictiv':'fictiv.com',
  'persistent':'persistent.com','mphasis':'mphasis.com','hexaware':'hexaware.com',
  'ltimindtree':'ltimindtree.com','lti':'ltimindtree.com','tech mahindra':'techmahindra.com',
  'hcl':'hcltech.com','oracle':'oracle.com','microsoft':'microsoft.com',
  'amazon':'amazon.com','google':'google.com','meta':'meta.com','apple':'apple.com',
  'pwc':'pwc.com','kpmg':'kpmg.com','ey ':'ey.com','ernst':'ey.com',
  'mindtree':'ltimindtree.com','coforge':'coforge.com','niit':'niit.com',
  'birlasoft':'birlasoft.com','merilytics':'merilytics.com','slalom':'slalom.com',
  'publicis':'publicissapient.com','sapient':'publicissapient.com',
  'zendesk':'zendesk.com','hubspot':'hubspot.com','servicenow':'servicenow.com',
  'adobe':'adobe.com','sap':'sap.com',
};

function companyDomain(name){
  if(!name) return null;
  const l=name.toLowerCase();
  for(const [k,v] of Object.entries(DOMAIN_MAP)){if(l.includes(k)) return v;}
  // generic: take first word, strip non-alphanum, add .com
  const w=l.split(/[\s,.()/]+/)[0].replace(/[^a-z0-9]/g,'');
  return w.length>2?w+'.com':null;
}

function logoUrl(company){
  const d=companyDomain(company);
  return d?`https://logo.clearbit.com/${d}`:null;
}

let ALL=[], saved=new Set(JSON.parse(localStorage.getItem('sf-saved-v3')||'[]'));
let activePlatform='All', activeLoc='', activeHours=168, activeSeniority='', sortField='default';
let currentPage=1, perPage=30, filtered=[];

function city(j){
  const h=[(j.location||''),j.title,(j.company||'')].join(' ');
  for(const c of CITIES){if(h.toLowerCase().includes(c.toLowerCase()))return c==='Bangalore'?'Bengaluru':c;}
  return 'India';
}

function fmtAge(h,raw){
  if(h===null)return{txt:raw||'—',cls:'age-old'};
  if(h===0)return{txt:'Just now',cls:'age-fresh'};
  if(h<1)return{txt:Math.round(h*60)+'m ago',cls:'age-fresh'};
  if(h<24)return{txt:Math.round(h)+'h ago',cls:'age-fresh'};
  if(h<48)return{txt:'Yesterday',cls:'age-recent'};
  return{txt:Math.floor(h/24)+'d ago',cls:'age-old'};
}

function initials(s){const w=(s||'?').trim().split(/\s+/);return w.length>=2?(w[0][0]+w[1][0]).toUpperCase():(w[0]||'?')[0].toUpperCase();}
function platClass(p){const m={LinkedIn:'plat-LinkedIn',Indeed:'plat-Indeed',Greenhouse:'plat-Greenhouse',Lever:'plat-Lever',Workday:'plat-Workday',Glassdoor:'plat-Glassdoor',SmartRecruiters:'plat-SmartRecruiters'};for(const k in m)if((p||'').includes(k))return m[k];return 'plat-other';}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function load(){
  try{
    const r=await fetch(JOBS_URL+'?t='+Date.now());
    const d=await r.json();
    ALL=(d.jobs||[]).map(j=>({...j,_city:city(j),_h:j.age_hours!=null?+j.age_hours:j.age_days!=null?+j.age_days*24:null}));
    window._lastTs=d.scraped_at;
    if(d.scraped_at){
      const s='Updated '+new Date(d.scraped_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
      document.getElementById('last-updated').textContent=s;
      document.getElementById('footer-updated').textContent=s;
    }
    buildPlatPills();buildLocOptions();applyFilters();
  }catch(e){
    document.getElementById('jobs-list').innerHTML='<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load jobs</h3></div>';
  }
}

function buildPlatPills(){
  const counts={};ALL.forEach(j=>{counts[j.platform]=(counts[j.platform]||0)+1;});
  const total=ALL.length;
  document.getElementById('plat-pills').innerHTML=
    `<div class="plat-chip${activePlatform==='All'?' active':''}" onclick="setPlatform('All')">All <span class="cnt">${total}</span></div>`+
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([p,n])=>
      `<div class="plat-chip${activePlatform===p?' active':''}" onclick="setPlatform('${esc(p)}')">${esc(p)} <span class="cnt">${n}</span></div>`
    ).join('');
}

function buildLocOptions(){
  const cities=[...new Set(ALL.map(j=>j._city))].sort();
  const o='<option value="">All Cities</option>'+cities.map(c=>`<option value="${c}"${c===activeLoc?' selected="selected"':''}>${c}</option>`).join('');
  document.getElementById('hero-loc').innerHTML=o;
}

function setPlatform(p){activePlatform=p;buildPlatPills();currentPage=1;applyFilters();}
function setLoc(v){activeLoc=v;currentPage=1;applyFilters();}
function setTime(v){activeHours=+v;currentPage=1;applyFilters();}
function setSeniority(v){activeSeniority=v;document.getElementById('hero-sen').value=v;currentPage=1;applyFilters();}

function clearAll(){
  document.getElementById('search-input').value='';
  document.getElementById('hero-loc').value='';
  document.getElementById('hero-sen').value='';
  document.getElementById('time-sel').value='168';
  document.getElementById('sort-sel').value='default';
  activePlatform='All';activeLoc='';activeHours=168;activeSeniority='';sortField='default';
  buildPlatPills();currentPage=1;applyFilters();
}

function applyFilters(){
  const q=(document.getElementById('search-input').value||'').toLowerCase().trim();
  sortField=document.getElementById('sort-sel').value;
  filtered=ALL.filter(j=>{
    const h=j._h;
    if(activeHours<168){if(h===null||h>activeHours)return false;}
    else{if(h!==null&&h>activeHours)return false;}
    if(activePlatform!=='All'&&j.platform!==activePlatform)return false;
    if(activeLoc&&j._city!==activeLoc)return false;
    if(activeSeniority&&j.seniority&&j.seniority!==activeSeniority)return false;
    if(q&&!j.title.toLowerCase().includes(q)&&!(j.company||'').toLowerCase().includes(q))return false;
    return true;
  });
  if(sortField==='title')filtered.sort((a,b)=>a.title.localeCompare(b.title));
  else if(sortField==='company')filtered.sort((a,b)=>(a.company||'').localeCompare(b.company||''));
  else filtered.sort((a,b)=>(a._h!==null?a._h:Infinity)-(b._h!==null?b._h:Infinity));
  document.getElementById('results-count').innerHTML=`<strong>${filtered.length}</strong> jobs in India`;
  currentPage=1;renderCards();
}

function renderCards(){
  const total=filtered.length;
  const pages=Math.max(1,Math.ceil(total/perPage));
  currentPage=Math.min(currentPage,pages);
  const slice=filtered.slice((currentPage-1)*perPage,currentPage*perPage);

  if(!total){
    document.getElementById('jobs-list').innerHTML='<div class="empty-state"><div class="icon">🔍</div><h3>No jobs found</h3></div>';
    document.getElementById('pagination').innerHTML='';
    return;
  }

  document.getElementById('jobs-list').innerHTML=slice.map(j=>{
    const{txt,cls}=fmtAge(j._h,j.posted);
    const logo=logoUrl(j.company);
    const av=initials(j.company||j.title);
    const safeUrl=(j.url||'').replace(/'/g,"\\'");
    const sen=j.seniority;
    const isNew=j._h!==null&&j._h<=6;
    const logoHtml=logo
      ?`<img src="${esc(logo)}" alt="${esc(j.company)}" onerror="this.parentNode.innerHTML='${av}'">`
      :av;
    return `<div class="job-card">
  <div class="jc-header">
    <div class="jc-logo">${logoHtml}</div>
    <div class="jc-company-row">
      <div class="jc-company">${esc(j.company||'—')}</div>
      <span class="jc-plat ${platClass(j.platform)}">${esc(j.platform)}</span>
    </div>
  </div>
  <div class="jc-title">${esc(j.title)}</div>
  <div class="jc-badges">
    ${sen?`<span class="badge badge-${sen}">${sen==='senior'?'Senior':sen==='mid'?'Mid':'Junior'}</span>`:''}
    ${isNew?'<span class="badge badge-new">New</span>':''}
  </div>
  <div class="jc-footer">
    <div class="jc-meta">
      <span>📍 ${esc(j._city||'India')}</span>
      <span class="${cls}">${txt}</span>
    </div>
    ${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener" class="btn-apply">Apply →</a>`:''}
  </div>
</div>`;
  }).join('');

  renderPagination(pages);
}

function mkBtn(label,page,extra){return '<button class="page-btn'+extra+'" onclick="goPage('+page+')">'+(label||page)+'</button>';}
function mkDis(label){return '<button class="page-btn" disabled="disabled">'+label+'</button>';}
function renderPagination(pages){
  const el=document.getElementById('pagination');
  if(pages<=1){el.innerHTML='';return;}
  let html=currentPage===1?mkDis('‹'):mkBtn('‹',currentPage-1,'');
  const show=new Set([1,pages].concat([currentPage-1,currentPage,currentPage+1].filter(function(p){return p>=1&&p<=pages;})));
  let prev=0;
  Array.from(show).sort(function(a,b){return a-b;}).forEach(function(p){
    if(prev&&p-prev>1)html+='<span class="page-ellipsis">…</span>';
    html+=mkBtn(p,p,p===currentPage?' active':'');
    prev=p;
  });
  html+=currentPage===pages?mkDis('›'):mkBtn('›',currentPage+1,'');
  el.innerHTML=html;
}

function goPage(p){
  const pages=Math.max(1,Math.ceil(filtered.length/perPage));
  if(p<1||p>pages)return;
  currentPage=p;renderCards();
  window.scrollTo({top:0,behavior:'smooth'});
}

let _poll,_timer,_timerSecs=120;
function cancelRefresh(){
  clearInterval(_poll);clearInterval(_timer);
  document.getElementById('timer-banner').classList.remove('show');
  const btn=document.getElementById('refresh-btn');
  btn.classList.remove('running');
  document.getElementById('spin-icon').className='spin';
  document.getElementById('refresh-label').textContent='Refresh Jobs';
}
async function triggerRefresh(){
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('running');
  document.getElementById('spin-icon').className='spin active';
  document.getElementById('refresh-label').textContent='Scraping…';
  _timerSecs=120;
  document.getElementById('timer-banner').classList.add('show');
  document.getElementById('timer-countdown').textContent=fmtTimer(_timerSecs);
  clearInterval(_timer);
  _timer=setInterval(()=>{_timerSecs--;document.getElementById('timer-countdown').textContent=_timerSecs<0?'any moment…':fmtTimer(_timerSecs);},1000);
  try{await fetch(WORKER_URL,{method:'POST'});}catch(e){}
  let n=0;clearInterval(_poll);
  _poll=setInterval(async()=>{
    n++;
    try{
      const r=await fetch(JOBS_URL+'?t='+Date.now());
      const d=await r.json();
      if(d.scraped_at&&d.scraped_at!==window._lastTs){
        cancelRefresh();
        ALL=(d.jobs||[]).map(j=>({...j,_city:city(j),_h:j.age_hours!=null?+j.age_hours:j.age_days!=null?+j.age_days*24:null}));
        window._lastTs=d.scraped_at;
        const s='Updated '+new Date(d.scraped_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        document.getElementById('last-updated').textContent=s;
        document.getElementById('footer-updated').textContent=s;
        buildPlatPills();buildLocOptions();applyFilters();
        showToast('✓ Jobs updated — '+ALL.length+' results');
      }
    }catch(e){}
    if(n>40){cancelRefresh();showToast('Scraper taking longer — check back soon');}
  },15000);
}
function fmtTimer(s){const m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0':'')+ss;}

let _tt;
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),3200);}
load();
</script>
