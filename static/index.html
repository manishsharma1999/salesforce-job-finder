<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Salesforce Jobs India</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f4ff;--white:#fff;--accent:#4f46e5;--accent2:#7c3aed;--accent-light:#ede9fe;
  --green:#059669;--green-light:#d1fae5;--orange:#d97706;--orange-light:#fef3c7;
  --blue:#0284c7;--blue-light:#e0f2fe;--text:#0f172a;--text2:#475569;--muted:#94a3b8;
  --border:#e2e8f0;--radius:14px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.06);
  --shadow-hover:0 8px 32px rgba(79,70,229,.15);
}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{background:var(--white);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.header-inner{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
.logo-text{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.5px}
.logo-text span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:10px}
.last-scraped{font-size:.75rem;color:var(--muted);white-space:nowrap}
#refresh-btn{display:flex;align-items:center;gap:6px;padding:9px 18px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap;box-shadow:0 2px 8px rgba(79,70,229,.3)}
#refresh-btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(79,70,229,.4)}
#refresh-btn.running{opacity:.7;pointer-events:none}
.spin{display:inline-block}.spin.active{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 50%,#a855f7 100%);padding:52px 24px 68px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E");pointer-events:none}
.hero h1{font-size:2.4rem;font-weight:900;color:#fff;letter-spacing:-1px;margin-bottom:10px;position:relative}
.hero h1 span{background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero p{color:rgba(255,255,255,.8);font-size:1rem;margin-bottom:32px;position:relative}
.search-bar{background:var(--white);border-radius:16px;padding:8px;display:flex;gap:8px;align-items:center;max-width:720px;margin:0 auto;box-shadow:0 8px 32px rgba(0,0,0,.2);position:relative;flex-wrap:wrap}
.sib{flex:1;display:flex;align-items:center;gap:8px;padding:6px 12px;border-right:1px solid var(--border);min-width:160px}
.sib:last-of-type{border-right:none}
.sib svg{color:var(--muted);flex-shrink:0}
.sib input,.sib select{border:none;outline:none;font-size:.92rem;color:var(--text);background:transparent;width:100%;font-family:inherit}
.search-btn{padding:12px 24px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;white-space:nowrap}
.search-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.4)}

.stats-strip{background:var(--white);border-bottom:1px solid var(--border)}
.stats-inner{max-width:1200px;margin:0 auto;padding:0 24px;display:flex;overflow-x:auto}
.stat-item{padding:16px 28px;display:flex;align-items:center;gap:10px;border-right:1px solid var(--border);white-space:nowrap;flex-shrink:0}
.stat-item:last-child{border-right:none}
.stat-num{font-size:1.5rem;font-weight:800;color:var(--accent)}
.stat-lbl{font-size:.78rem;color:var(--text2);font-weight:500}

.main-wrap{max-width:1200px;margin:0 auto;padding:28px 24px 64px;display:flex;gap:24px;align-items:flex-start}
.sidebar{width:260px;flex-shrink:0;position:sticky;top:80px}
.filter-card{background:var(--white);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}
.filter-title{font-size:.78rem;font-weight:700;color:var(--text);text-transform:uppercase;letter-spacing:.8px;margin-bottom:14px;display:flex;align-items:center;gap:6px}
.filter-option{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;transition:background .15s;font-size:.875rem;color:var(--text2);border:1.5px solid transparent}
.filter-option:hover{background:#f8fafc}
.filter-option.active{background:var(--accent-light);color:var(--accent);border-color:var(--accent);font-weight:600}
.filter-count{margin-left:auto;font-size:.72rem;background:#f1f5f9;color:var(--muted);padding:1px 7px;border-radius:20px;font-weight:600}
.filter-option.active .filter-count{background:var(--accent);color:#fff}

.jobs-wrap{flex:1;min-width:0}
.active-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.active-chip{display:flex;align-items:center;gap:5px;padding:4px 10px;background:var(--accent-light);border:1px solid #c4b5fd;border-radius:20px;font-size:.75rem;color:var(--accent);font-weight:600;cursor:pointer}
.active-chip:hover{background:#ddd6fe}
.results-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.results-count{font-size:.875rem;color:var(--text2)}
.results-count strong{color:var(--text);font-weight:700}
.sort-row{display:flex;gap:8px;align-items:center}
.sort-label{font-size:.8rem;color:var(--muted)}
.sort-select{padding:7px 12px;border:1.5px solid var(--border);border-radius:8px;color:var(--text);font-size:.82rem;outline:none;cursor:pointer;background:var(--white)}

.job-card{background:var(--white);border:1.5px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start;transition:all .2s;position:relative;overflow:hidden;animation:fadeUp .3s ease both}
.job-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent;transition:background .2s}
.job-card:hover{border-color:var(--accent);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.job-card:hover::before{background:linear-gradient(180deg,var(--accent),var(--accent2))}
.job-avatar{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#ede9fe,#ddd6fe);display:grid;place-items:center;font-size:1.1rem;font-weight:800;color:var(--accent);flex-shrink:0;border:1.5px solid var(--border)}
.job-body{flex:1;min-width:0}
.job-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:3px}
.job-title{font-size:1rem;font-weight:700;color:var(--text);line-height:1.35}
.new-badge{background:var(--green-light);color:var(--green);font-size:.65rem;font-weight:800;padding:2px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;flex-shrink:0}
.job-company{font-size:.85rem;color:var(--text2);font-weight:500;margin-bottom:10px}
.job-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{display:flex;align-items:center;gap:4px;font-size:.75rem;padding:3px 10px;border-radius:20px;border:1px solid var(--border);color:var(--text2);background:#f8fafc}
.tag.loc{color:var(--blue);background:var(--blue-light);border-color:#bae6fd}
.tag.t-new{color:var(--green);background:var(--green-light);border-color:#6ee7b7}
.tag.t-old{color:var(--orange);background:var(--orange-light);border-color:#fcd34d}
.tag.p-LinkedIn{color:#0a66c2;background:#e8f0fe;border-color:#bfdbfe}
.tag.p-Indeed{color:#003a9b;background:#eff6ff;border-color:#bfdbfe}
.job-footer{display:flex;align-items:center;gap:8px}
.apply-btn{display:flex;align-items:center;gap:5px;padding:8px 18px;background:var(--accent);color:#fff;border-radius:8px;font-size:.82rem;font-weight:700;text-decoration:none;transition:all .2s}
.apply-btn:hover{background:var(--accent2);transform:translateY(-1px)}
.save-btn{display:flex;align-items:center;gap:5px;padding:8px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:600;color:var(--text2);cursor:pointer;background:transparent;transition:all .2s}
.save-btn:hover{border-color:var(--accent);color:var(--accent)}
.save-btn.saved{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}

.state-box{text-align:center;padding:80px 20px;color:var(--muted)}
.state-icon{font-size:3.5rem;margin-bottom:16px}
.state-box h3{font-size:1.1rem;color:var(--text);margin-bottom:6px}

.skeleton{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--text);color:#fff;border-radius:10px;padding:10px 20px;font-size:.85rem;opacity:0;pointer-events:none;transition:all .3s;z-index:999;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:900px){.main-wrap{flex-direction:column}.sidebar{width:100%;position:static}}
@media(max-width:600px){.hero h1{font-size:1.7rem}.search-bar{flex-direction:column}.sib{border-right:none;border-bottom:1px solid var(--border)}.header-inner{padding:0 14px}.main-wrap{padding:16px 14px 48px}.last-scraped{display:none}}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="#">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">SF<span>Jobs</span>.in</span>
    </a>
    <div class="header-right">
      <span class="last-scraped" id="last-scraped"></span>
      <button id="refresh-btn" onclick="triggerRefresh()">
        <span class="spin" id="spin-icon">↻</span> Refresh Jobs
      </button>
    </div>
  </div>
</header>

<div class="hero">
  <h1>Find Your <span>Salesforce</span> Dream Job</h1>
  <p>Fresh jobs from LinkedIn & Indeed · India only · Updated every day at 7:30 AM IST</p>
  <div class="search-bar">
    <div class="sib" style="flex:2">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="Search title, company…" oninput="applyFilters()"/>
    </div>
    <div class="sib" style="border-right:none">
      <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      <select id="loc-filter" onchange="applyFilters()">
        <option value="">All Locations</option>
      </select>
    </div>
    <button class="search-btn" onclick="applyFilters()">Search Jobs</button>
  </div>
</div>

<div class="stats-strip">
  <div class="stats-inner">
    <div class="stat-item"><span class="stat-num" id="stat-total">—</span><span class="stat-lbl">Total Jobs</span></div>
    <div class="stat-item"><span class="stat-num" id="stat-today">—</span><span class="stat-lbl">Posted Today</span></div>
    <div class="stat-item"><span class="stat-num" id="stat-linkedin">—</span><span class="stat-lbl">LinkedIn</span></div>
    <div class="stat-item"><span class="stat-num" id="stat-indeed">—</span><span class="stat-lbl">Indeed</span></div>
  </div>
</div>

<div class="main-wrap">
  <div class="sidebar">
    <div class="filter-card">
      <div class="filter-title">📅 Posted Within</div>
      <div class="filter-group" id="time-filters">
        <div class="filter-option active" data-days="3" onclick="setTimeFilter(this)"><span>Last 3 Days</span><span class="filter-count" id="fc-3">—</span></div>
        <div class="filter-option" data-days="1" onclick="setTimeFilter(this)"><span>Last 24 Hours</span><span class="filter-count" id="fc-1">—</span></div>
        <div class="filter-option" data-days="0" onclick="setTimeFilter(this)"><span>Today Only</span><span class="filter-count" id="fc-0">—</span></div>
      </div>
    </div>
    <div class="filter-card">
      <div class="filter-title">📊 Platform</div>
      <div class="filter-group" id="platform-filters"></div>
    </div>
    <div class="filter-card">
      <div class="filter-title">📍 Location</div>
      <div class="filter-group" id="location-filters"></div>
    </div>
  </div>

  <div class="jobs-wrap">
    <div class="active-filters" id="active-chips"></div>
    <div class="results-header">
      <div class="results-count" id="result-count"></div>
      <div class="sort-row">
        <span class="sort-label">Sort by</span>
        <select class="sort-select" id="sort" onchange="applyFilters()">
          <option value="default">Most Recent</option>
          <option value="title">Title A–Z</option>
          <option value="company">Company A–Z</option>
        </select>
      </div>
    </div>
    <div id="jobs-list">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="background:#fff;border-radius:14px;padding:20px;display:flex;gap:16px"><div class="skeleton" style="width:48px;height:48px;border-radius:12px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:18px;width:60%"></div><div class="skeleton" style="height:14px;width:35%"></div><div style="display:flex;gap:6px"><div class="skeleton" style="height:24px;width:70px;border-radius:20px"></div><div class="skeleton" style="height:24px;width:90px;border-radius:20px"></div></div></div></div>
        <div style="background:#fff;border-radius:14px;padding:20px;display:flex;gap:16px"><div class="skeleton" style="width:48px;height:48px;border-radius:12px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:18px;width:55%"></div><div class="skeleton" style="height:14px;width:40%"></div><div style="display:flex;gap:6px"><div class="skeleton" style="height:24px;width:80px;border-radius:20px"></div><div class="skeleton" style="height:24px;width:70px;border-radius:20px"></div></div></div></div>
        <div style="background:#fff;border-radius:14px;padding:20px;display:flex;gap:16px"><div class="skeleton" style="width:48px;height:48px;border-radius:12px;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="skeleton" style="height:18px;width:65%"></div><div class="skeleton" style="height:14px;width:30%"></div><div style="display:flex;gap:6px"><div class="skeleton" style="height:24px;width:60px;border-radius:20px"></div><div class="skeleton" style="height:24px;width:100px;border-radius:20px"></div></div></div></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const JOBS_URL   = 'https://manishsharma1999.github.io/salesforce-job-finder/jobs.json';
const WORKER_URL = 'https://job-finder-refresh.manishsharma1k9909.workers.dev';
const CITIES = ['Mumbai','Delhi','Bengaluru','Bangalore','Hyderabad','Chennai','Pune','Kolkata','Ahmedabad','Noida','Gurugram','Gurgaon','Jaipur','Chandigarh','Kochi','Lucknow','Bhopal','Indore','Nagpur','Surat','Vadodara','Coimbatore','Visakhapatnam','Trivandrum','Thiruvananthapuram','Remote'];

let ALL_JOBS=[], saved=new Set(JSON.parse(localStorage.getItem('sf-saved')||'[]'));
let activeTime=3, activePlatform='All', activeLocation='';

function extractCity(j){
  const hay=[(j.location||''),j.title,(j.company||''),(j.posted||'')].join(' ');
  for(const c of CITIES) if(hay.toLowerCase().includes(c.toLowerCase())) return c==='Bengaluru'||c==='Bangalore'?'Bengaluru':c;
  return 'India';
}

async function loadJobs(){
  try{
    const r=await fetch(JOBS_URL+'?t='+Date.now());
    const d=await r.json();
    ALL_JOBS=(d.jobs||[]).map(j=>({...j,city:extractCity(j)}));
    window._lastTs=d.scraped_at;
    document.getElementById('stat-total').textContent=d.total;
    document.getElementById('stat-today').textContent=ALL_JOBS.filter(j=>(j.age_days||0)===0).length;
    document.getElementById('stat-linkedin').textContent=ALL_JOBS.filter(j=>j.platform==='LinkedIn').length;
    document.getElementById('stat-indeed').textContent=ALL_JOBS.filter(j=>j.platform==='Indeed').length;
    if(d.scraped_at){
      const dt=new Date(d.scraped_at);
      document.getElementById('last-scraped').textContent='Updated '+dt.toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    }
    buildSidebar(); buildLocDropdown(); updateTimeCounts(); applyFilters();
  }catch(e){
    document.getElementById('jobs-list').innerHTML='<div class="state-box"><div class="state-icon">⚠️</div><h3>Could not load jobs</h3><p>Check your connection and try again.</p></div>';
  }
}

function buildSidebar(){
  const platforms=['All',...new Set(ALL_JOBS.map(j=>j.platform))];
  document.getElementById('platform-filters').innerHTML=platforms.map(p=>{
    const cnt=p==='All'?ALL_JOBS.length:ALL_JOBS.filter(j=>j.platform===p).length;
    return `<div class="filter-option${p===activePlatform?' active':''}" onclick="setPlatform('${p}',this)"><span>${p}</span><span class="filter-count">${cnt}</span></div>`;
  }).join('');
  const cities=[...new Set(ALL_JOBS.map(j=>j.city))].map(c=>({c,n:ALL_JOBS.filter(j=>j.city===c).length})).sort((a,b)=>b.n-a.n).slice(0,9);
  document.getElementById('location-filters').innerHTML=[
    `<div class="filter-option${activeLocation===''?' active':''}" onclick="setLocation('',this)"><span>All Cities</span><span class="filter-count">${ALL_JOBS.length}</span></div>`,
    ...cities.map(({c,n})=>`<div class="filter-option${activeLocation===c?' active':''}" onclick="setLocation('${c}',this)"><span>${c}</span><span class="filter-count">${n}</span></div>`)
  ].join('');
}

function buildLocDropdown(){
  const cities=[...new Set(ALL_JOBS.map(j=>j.city))].sort();
  document.getElementById('loc-filter').innerHTML='<option value="">All Locations</option>'+cities.map(c=>`<option value="${c}"${c===activeLocation?' selected':''}>${c}</option>`).join('');
}

function updateTimeCounts(){
  document.getElementById('fc-3').textContent=ALL_JOBS.filter(j=>(j.age_days||0)<=3).length;
  document.getElementById('fc-1').textContent=ALL_JOBS.filter(j=>(j.age_days||0)<=1).length;
  document.getElementById('fc-0').textContent=ALL_JOBS.filter(j=>(j.age_days||0)===0).length;
}

function setTimeFilter(el){
  document.querySelectorAll('#time-filters .filter-option').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); activeTime=+el.dataset.days; applyFilters();
}
function setPlatform(p,el){
  activePlatform=p;
  document.querySelectorAll('#platform-filters .filter-option').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); applyFilters();
}
function setLocation(loc,el){
  activeLocation=loc; document.getElementById('loc-filter').value=loc;
  document.querySelectorAll('#location-filters .filter-option').forEach(e=>e.classList.remove('active'));
  el.classList.add('active'); applyFilters();
}

function applyFilters(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  const loc=document.getElementById('loc-filter').value||activeLocation;
  const sort=document.getElementById('sort').value;
  let jobs=ALL_JOBS.filter(j=>{
    const age=j.age_days??0;
    if(activeTime===0&&age!==0) return false;
    if(activeTime===1&&age>1) return false;
    if(activeTime===3&&age>3) return false;
    if(activePlatform!=='All'&&j.platform!==activePlatform) return false;
    if(loc&&j.city!==loc) return false;
    if(q&&!j.title.toLowerCase().includes(q)&&!(j.company||'').toLowerCase().includes(q)) return false;
    return true;
  });
  if(sort==='title') jobs.sort((a,b)=>a.title.localeCompare(b.title));
  if(sort==='company') jobs.sort((a,b)=>(a.company||'').localeCompare(b.company||''));
  document.getElementById('result-count').innerHTML=`Showing <strong>${jobs.length}</strong> jobs`;
  const chips=[];
  if(activeTime<3) chips.push({label:activeTime===0?'Today only':'Last 24 hrs',fn:'resetTime()'});
  if(activePlatform!=='All') chips.push({label:activePlatform,fn:'resetPlatform()'});
  if(loc) chips.push({label:loc,fn:'resetLocation()'});
  if(q) chips.push({label:`"${q}"`,fn:'clearSearch()'});
  document.getElementById('active-chips').innerHTML=chips.map(c=>`<div class="active-chip" onclick="${c.fn}">${c.label} <span>×</span></div>`).join('');
  renderJobs(jobs);
}

function resetTime(){activeTime=3;document.querySelectorAll('#time-filters .filter-option').forEach((e,i)=>e.classList.toggle('active',i===0));applyFilters();}
function resetPlatform(){activePlatform='All';document.querySelectorAll('#platform-filters .filter-option').forEach((e,i)=>e.classList.toggle('active',i===0));applyFilters();}
function resetLocation(){activeLocation='';document.getElementById('loc-filter').value='';document.querySelectorAll('#location-filters .filter-option').forEach((e,i)=>e.classList.toggle('active',i===0));applyFilters();}
function clearSearch(){document.getElementById('search').value='';applyFilters();}

function renderJobs(jobs){
  const list=document.getElementById('jobs-list');
  if(!jobs.length){list.innerHTML='<div class="state-box"><div class="state-icon">🔍</div><h3>No jobs found</h3><p>Try adjusting your filters.</p></div>';return;}
  list.innerHTML=jobs.map((j,i)=>{
    const age=j.age_days??0;
    const timeTag=age===0?'Today':age===1?'Yesterday':`${age}d ago`;
    const timeCls=age===0?'tag t-new':'tag t-old';
    const platCls='tag p-'+(j.platform||'default');
    const av=((j.company||j.title||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase());
    const isSaved=saved.has(j.url||'');
    return `<div class="job-card" style="animation-delay:${Math.min(i*25,500)}ms">
      <div class="job-avatar">${av}</div>
      <div class="job-body">
        <div class="job-top">
          <div>
            <div class="job-title">${esc(j.title)}</div>
            <div class="job-company">${esc(j.company||'Company not listed')}</div>
          </div>
          ${age===0?'<span class="new-badge">New</span>':''}
        </div>
        <div class="job-tags">
          <span class="${timeCls}">🕐 ${timeTag}</span>
          <span class="tag loc">📍 ${esc(j.city||'India')}</span>
          <span class="${platCls}">${esc(j.platform)}</span>
        </div>
        <div class="job-footer">
          ${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener" class="apply-btn">Apply Now ↗</a>`:'<span></span>'}
          <button class="save-btn${isSaved?' saved':''}" onclick="toggleSave('${(j.url||'').replace(/'/g,"\\'")}',this)">
            ${isSaved?'★ Saved':'☆ Save'}
          </button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleSave(url,btn){
  if(saved.has(url)){saved.delete(url);btn.innerHTML='☆ Save';btn.classList.remove('saved');}
  else{saved.add(url);btn.innerHTML='★ Saved';btn.classList.add('saved');showToast('Job saved!');}
  localStorage.setItem('sf-saved',JSON.stringify([...saved]));
}

let refreshPoll;
async function triggerRefresh(){
  if(!WORKER_URL||WORKER_URL==='REPLACE_WITH_WORKER_URL'){showToast('Refresh not available.');return;}
  const btn=document.getElementById('refresh-btn');
  btn.classList.add('running');
  btn.innerHTML='<span class="spin active" id="spin-icon">↻</span> Scraping…';
  showToast('Scraper started — updates in ~90 seconds');
  try{await fetch(WORKER_URL,{method:'POST'});}catch(e){}
  let attempts=0;
  refreshPoll=setInterval(async()=>{
    attempts++;
    try{
      const r=await fetch(JOBS_URL+'?t='+Date.now());
      const d=await r.json();
      if(d.scraped_at&&d.scraped_at!==window._lastTs){
        clearInterval(refreshPoll);
        btn.classList.remove('running');
        btn.innerHTML='<span class="spin" id="spin-icon">↻</span> Refresh Jobs';
        await loadJobs(); showToast('✓ Jobs updated!');
      }
    }catch(e){}
    if(attempts>24){clearInterval(refreshPoll);btn.classList.remove('running');btn.innerHTML='<span class="spin" id="spin-icon">↻</span> Refresh Jobs';}
  },15000);
}

let toastTimer;
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
loadJobs();
</script>
